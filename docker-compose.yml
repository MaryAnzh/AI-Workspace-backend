version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${MODE_ENV}
      PORT: ${PORT}
    ports:
      - "4000:4000"
    restart: on-failure
    networks:
      - hub-net
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/src/main.js
      "

networks:
  hub-net:
    driver: bridge
